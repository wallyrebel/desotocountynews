name: RSS to WordPress Automation

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no publishing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      smoke_test:
        description: 'Test models on real RSS samples without publishing'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      single_feed:
        description: 'Process only a specific feed (by name)'
        required: false
        default: ''
        type: string

# Serialize publishers so two runs cannot publish from the same stale database.
concurrency:
  group: rss-to-wordpress-publisher
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  process-feeds:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest

      - name: Test backlog handling before publishing
        run: python -m pytest tests -q

      - name: Create data directory
        run: mkdir -p data

      - name: Restore database from cache
        uses: actions/cache/restore@v4
        with:
          path: data/processed.db
          key: processed-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            processed-db-

      - name: Run RSS to WordPress
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SMOKE_TEST: ${{ github.event.inputs.smoke_test }}
          SINGLE_FEED: ${{ github.event.inputs.single_feed }}
          # OpenAI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          OPENAI_EXTRACTION_MODEL: gpt-5.6-luna
          ARTICLE_TARGET_MIN_WORDS: '150'
          OPENAI_FALLBACK_MODEL: ${{ secrets.OPENAI_FALLBACK_MODEL || 'gpt-4.1-nano' }}
          
          # WordPress
          WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_POST_STATUS: publish
          
          # Image providers (optional)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          
          # Logging
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'INFO' }}
          TIMEZONE: ${{ secrets.TIMEZONE || 'America/Chicago' }}
          
          # Email notifications (optional)
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          ARGS=(--config feeds.yaml)
          
          # Add dry-run flag if specified
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          
          # Add single-feed flag if specified
          if [ -n "$SINGLE_FEED" ]; then
            ARGS+=(--single-feed "$SINGLE_FEED")
          fi
          
          if [ "$SMOKE_TEST" = "true" ]; then
            python scripts/smoke_rss.py
          else
            python -m rss_to_wp run "${ARGS[@]}"
          fi

      - name: Save database to cache
        if: ${{ always() && hashFiles('data/processed.db') != '' && github.event.inputs.dry_run != 'true' && github.event.inputs.smoke_test != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: data/processed.db
          key: processed-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summary
        if: always()
        env:
          SUMMARY_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SUMMARY_SINGLE_FEED: ${{ github.event.inputs.single_feed || 'All feeds' }}
        run: |
          echo "## RSS to WordPress Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "- **Dry Run**: $SUMMARY_DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Single Feed**: $SUMMARY_SINGLE_FEED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f data/processed.db ]; then
            COUNT=$(sqlite3 data/processed.db "SELECT COUNT(*) FROM processed_entries;" 2>/dev/null || echo "N/A")
            echo "- **Total Processed Entries**: $COUNT" >> $GITHUB_STEP_SUMMARY
          fi
